# https://github.com/npm/documentation/blob/211bf9524e30b0321f42c7a4958cc014378c3a4c/content/packages-and-modules/securing-your-code/trusted-publishers.mdx?plain=1#L88-L113
name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Required to create GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build --if-present
      - run: npm test
      - run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm publish
